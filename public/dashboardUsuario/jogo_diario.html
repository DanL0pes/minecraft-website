<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=forum,home,logout,school,sports_esports" />
    <link rel="stylesheet" href="../assets/css/styleDefault.css">
    <link rel="stylesheet" href="../assets/css/styleDashboard.css">
    <link rel="stylesheet" href="../assets/css/styleGame.css">
    <title>CreeperGuide | Dashboard</title>
</head>

<body>
    <section class="sessao-dashboard">
        <div class="container">
            <div class="sidebar">
                <div class="conteudo-sidebar">
                    <div class="img"></div>
                    <ul>
                        <li><a href="dashboard.html" class="material-symbols-outlined link">home <span>Inicio</span></a>
                        </li>
                        <li><a href="forum.html" class="material-symbols-outlined link">forum <span>Forúm</span></a>
                        </li>
                        <li><a href="cursos.html" class="material-symbols-outlined link">school <span>Curso</span></a>
                        </li>
                        <li><a href="jogo_diario.html" class="material-symbols-outlined link ativo">sports_esports
                                <span>Jogo
                                    Diário</span></a></li>
                    </ul>
                    <a href="#" class="material-symbols-outlined link logout">logout <span>Sair</span></a>
                </div>
            </div>
            <div class="conteudo">
                <div class="topBar">
                    <p id="info_usuario">
                        <span id="nome_usuario">dandansousa</span>
                        <span id="rank_usuario" class="experiente">Experiente</span>
                    </p>
                    <div class="foto-perfil">
                        <img src="../assets/images/usuario-perfil/default.png" id="foto_perfil" alt="">
                        <div class="config">
                            <ul>
                                <li><a href="#">Perfil</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="container-inicio">
                    <div class="game-display">
                        <div class="crafting">
                            <div class="game">
                                <h1 class="titulo">Crafting Game</h1>
                                <div class="display-craft" id="itemDisplay">
                                    <div class="row">
                                        <p class="item_frame" id="item_1"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="0"></p>
                                        <p class="item_frame" id="item_2"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="1"></p>
                                        <p class="item_frame" id="item_3"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="2"></p>
                                    </div>
                                    <div class="row">
                                        <p class="item_frame" id="item_4"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="3"></p>
                                        <p class="item_frame" id="item_5"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="4"></p>
                                        <p class="item_frame" id="item_6"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="5"></p>
                                    </div>
                                    <div class="row">
                                        <p class="item_frame" id="item_7"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="6"></p>
                                        <p class="item_frame" id="item_8"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="7"></p>
                                        <p class="item_frame" id="item_9"><img src="../assets/images/Vazio.png"
                                                ondrop="drop(event)" ondragover="permitirDrop(event)"
                                                onclick="limparItem(event)" id="8"></p>
                                    </div>
                                </div>
                                <button onclick="check()">Check</button>
                            </div>
                            <div id="img_res"></div>
                        </div>

                        <div class="tentativas">
                            <div id="div_tentativa"></div>
                        </div>
                    </div>
                    <div class="items-box">
                        <img src="../assets/images/Cobblestone.png" draggable="true" id="cobblestone"
                            ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Stick.png" draggable="true" id="stick"
                            ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Iron.png" draggable="true" id="iron" ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Diamond.png" draggable="true" id="diamond"
                            ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Gold.png" draggable="true" id="gold" ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Coal.png" draggable="true" id="coal" ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Oak_Planks.png" draggable="true" id="oak_planks"
                            ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Redstone.png" draggable="true" id="redstone"
                            ondragstart="inicioDrag(event)">
                        <img src="../assets/images/Vazio.png" draggable="true" id="vazio"
                            ondragstart="inicioDrag(event)">
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

<script src="../assets/script/dashboardUsuario/game.js"></script>
</html>
