<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back_ios,arrow_forward_ios,forum,home,logout,school,sports_esports" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/cal-heatmap/dist/plugins/Tooltip.min.js"></script>
    <script src="https://unpkg.com/cal-heatmap/dist/cal-heatmap.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/cal-heatmap/dist/cal-heatmap.css">
    <link rel="stylesheet" href="../assets/css/styleDefault.css">
    <link rel="stylesheet" href="../assets/css/styleDashboard.css">
    <link rel="stylesheet" href="../assets/css/styleInicioDashboard.css">
    <title>CreeperGuide | Dashboard</title>
</head>

<body>
    <section class="sessao-dashboard">
        <div class="container">
            <div class="sidebar">
                <div class="conteudo-sidebar">
                    <div class="img"></div>
                    <ul>
                        <li><a href="dashboard.html" class="material-symbols-outlined link ativo">home <span>Inicio</span></a></li>
                        <li><a href="forum.html" class="material-symbols-outlined link">forum <span>Forúm</span></a></li>
                        <li><a href="cursos.html" class="material-symbols-outlined link">school <span>Curso</span></a></li>
                        <li><a href="jogo_diario.html" class="material-symbols-outlined link">sports_esports <span>Jogo
                                    Diário</span></a></li>
                    </ul>
                    <a href="#" class="material-symbols-outlined link logout">logout <span>Sair</span></a>
                </div>
            </div>
            <div class="conteudo">
                <div class="topBar">
                    <p id="info_usuario">
                        <span id="nome_usuario">dandansousa</span>
                        <span id="rank_usuario"></span>
                    </p>
                    <div class="foto-perfil">
                        <img src="" id="foto_perfil" alt="">
                        <div class="config">
                            <ul>
                                <li><a href="#">Perfil</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="container-inicio">
                    <div class="cards">
                        <div class="card cursos pixel-border">
                            <div class="card-header">
                                <p>Em andamento:</p>
                            </div>
                            <div class="card-body progresso" id="curso_andamento_container">
                            </div>
                        </div>
                        <div class="card kpi pixel-border">
                            <div class="card-body">
                                <ul class="kpi">
                                    <div class="kpi-item">
                                        <h3>XP</h3>
                                        <p id="xp">0</p>
                                        <img src="../assets/images/icones/xp.gif" alt="">
                                    </div>
                                    <div class="kpi-item">
                                        <h3>Rank</h3>
                                        <p id="rank">Novato</p>
                                        <img src="../assets/images/icones/rank.png" alt="">
                                    </div>
                                    <div class="kpi-item">
                                        <h3>Cursos</h3>
                                        <p id="progresso">0</p>
                                        <img src="../assets/images/icones/progresso.png" alt="">
                                    </div>
                                </ul>
                                <a class="btn-jogodiario" href="jogo_diario.html">
                                    <h1>Jogue o Crafting Game</h1>
                                    <p>Descubra o crafting em menos de 3 tentativas e ganhe XP!</p>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="curso-acompanhamento" style="width: 100%;">
                        <h1>Aulas Realizadas</h1>
                        <div id="cal-heatmap" style="width: 100%;"></div>
                        <div class="botoes">
                            <button onclick="anteriorMesCalendario()" class="material-symbols-outlined inverted">arrow_forward_ios</button>
                            <button onclick="proximoMesCalendario()" class="material-symbols-outlined">arrow_forward_ios</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

<script src="../assets/script/dashboardUsuario/infoUsuario.js"></script>
<script src="../assets/script/dashboardUsuario/dashInicio.js"></script>
</html>
