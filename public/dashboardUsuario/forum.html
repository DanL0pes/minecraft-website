<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=forum,home,logout,school,send,sports_esports" />
    <link rel="stylesheet" href="../assets/css/styleDefault.css">
    <link rel="stylesheet" href="../assets/css/styleDashboard.css">
    <link rel="stylesheet" href="../assets/css/styleForum.css">
    <title>CreeperGuide | Dashboard</title>
</head>

<body>
    <section class="sessao-dashboard">
        <div class="container">
            <div class="sidebar">
                <div class="conteudo-sidebar">
                    <div class="img"></div>
                    <ul>
                        <li><a href="dashboard.html" class="material-symbols-outlined link">home <span>Inicio</span></a></li>
                        <li><a href="forum.html" class="material-symbols-outlined link ativo">forum <span>Forúm</span></a></li>
                        <li><a href="cursos.html" class="material-symbols-outlined link">school <span>Curso</span></a></li>
                        <li><a href="jogo_diario.html" class="material-symbols-outlined link">sports_esports <span>Jogo
                                    Diário</span></a></li>
                    </ul>
                    <a href="#" class="material-symbols-outlined link logout">logout <span>Sair</span></a>
                </div>
            </div>
            <div class="conteudo">
                <div class="topBar">
                    <p id="info_usuario">
                        <span id="nome_usuario">dandansousa</span>
                        <span id="rank_usuario"></span>
                    </p>
                    <div class="foto-perfil">
                        <img src="" id="foto_perfil" alt="">
                        <div class="config">
                            <ul>
                                <li><a href="#">Perfil</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="container-inicio">
                    <div class="perguntas_container">
                    </div>
                    <button class="btn-green btn_fazer_pergunta" onclick="fazerPergunta()">Fazer uma pergunta</button>
                </div>
            </div>
        </div>
    </section>
    <div class="modal" id="modalPerguntar">
        <div class="conteudo">
            <h1>Faça a pergunta</h1>
            <input type="text" placeholder="Tópico" id="ipt_titulo">
            <textarea placeholder="Descrição" id="ipt_descricao"></textarea>
            <button class="btn-green" onclick="perguntar(ipt_titulo.value, ipt_descricao.value)">Enviar</button>
            <button class="btn-red" onclick="fecharPergunta()">Cancelar</button>
        </div>
    </div>
</body>

<script src="../assets/script/dashboardUsuario/infoUsuario.js"></script>
<script src="../assets/script/dashboardUsuario/forum.js"></script>
</html>
