<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_drop_down,forum,home,logout,school,search,sports_esports" />
    <link rel="stylesheet" href="../assets/css/styleDefault.css">
    <link rel="stylesheet" href="../assets/css/styleDashboard.css">
    <link rel="stylesheet" href="../assets/css/styleCursos.css">
    <title>CreeperGuide | Dashboard</title>
</head>

<body>
    <section class="sessao-dashboard">
        <div class="container">
            <div class="sidebar">
                <div class="conteudo-sidebar">
                    <div class="img"></div>
                    <ul>
                        <li><a href="dashboard.html" class="material-symbols-outlined link">home <span>Inicio</span></a></li>
                        <li><a href="forum.html" class="material-symbols-outlined link">forum <span>Forúm</span></a></li>
                        <li><a href="cursos.html" class="material-symbols-outlined link ativo">school <span>Curso</span></a></li>
                        <li><a href="jogo_diario.html" class="material-symbols-outlined link">sports_esports <span>Jogo
                                    Diário</span></a></li>
                    </ul>
                    <a href="#" class="material-symbols-outlined link logout">logout <span>Sair</span></a>
                </div>
            </div>
            <div class="conteudo">
                <div class="topBar">
                    <p id="info_usuario">
                        <span id="nome_usuario">dandansousa</span>
                        <span id="rank_usuario" class="experiente">Experiente</span>
                    </p>
                    <div class="foto-perfil">
                        <img src="../assets/images/usuario-perfil/default.png" id="foto_perfil" alt="">
                        <div class="config">
                            <ul>
                                <li><a href="#">Perfil</a></li>
                                <li><a href="#">Configuração</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="container-inicio">
                    <div class="cursos_andamento pixel-border">
                        <div class="titulo" onclick="abrirCursos('andamento')">
                            <h2>Em andamento</h2>
                            <span class="material-symbols-outlined">arrow_drop_down</span>
                        </div>
                        <div class="cardsContainer" id="cards-andamento">
                            
                        </div>
                    </div>
                    <div class="todos_cursos pixel-border">
                        <div class="titulo">
                            <h2>Todos os Cursos</h2>
                            <div class="filter_pesquisa">
                                <div class="input_pesquisa">
                                    <span class="material-symbols-outlined">search</span>
                                    <input type="text" id="ipt_pesquisa_curso">
                                </div>
                            </div>
                        </div>
                        <div class="cardsContainer" id="todosCursosContainer">
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

<script src="../assets/script/dashboardUsuario/infoUsuario.js"></script>
<script src="../assets/script/dashboardUsuario/cursos.js"></script>
</html>
